<p class="com-access"><span class="com-access-item">命令别名:&nbsp;</span>OP <span class="italic">或</span> PREFERENCES</p>
<p class="body_text">显示“<a href="OPTIONS_dia.htm">选项</a>”对话框，以指定程序所有使用的预设设置。</p>
<p class="body_text">执行 +OPTIONS 命令，可设置显示“<a href="OPTIONS_dia.htm">选项</a>”对话框时的默认标签页。选项卡索引值从 0 开始，如设置索引值为 0，则显示“选项”对话框并定位到第1个选项卡。</p>
